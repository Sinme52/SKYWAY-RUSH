# main に push するたびに、ゲームを GitHub Pages に公開する。
# 公開するのは遊ぶのに必要なファイルだけ（原画 assets/raw や説明用の画像は含めない）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the files to publish
        run: |
          mkdir -p _site/assets
          cp index.html game.js track.js .nojekyll _site/
          cp assets/*.png assets/*.jpg _site/assets/
          ls -R _site | head -50
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
